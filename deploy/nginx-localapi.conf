upstream localapi_backend {
    server 127.0.0.1:15555;
    keepalive 32;
}

server {
    listen 5555 ssl;
    listen [::]:5555 ssl;
    server_name ipv4.instser.xyz ipv6.instser.xyz;

    ssl_certificate     /etc/nginx/ssl/scloud/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/scloud/key.pem;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    error_page 497 =301 https://$host:5555$request_uri;

    client_max_body_size 0;
    proxy_request_buffering off;

    location / {
        proxy_pass http://localapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
